      <h1 data-en="Welcome to CSE 2027" data-fr="Bienvenue à la CDDI 2027"></h1>
      <p data-en="Join us for the Conference on Sustainability in Engineering (CSE), hosted at McGill University in Montrèal. This national event is dedicated to empowering the next generation of engineers to lead with responsibility and innovation. Over three days, you'll connect with passionate peers, attend thought-provoking talks, and participate in hands-on workshops—all focused on building a more sustainable future together."
         data-fr="Participez au Congrès sur le développement durable en ingénierie (CDDI), organisé à l'Université McGill à Montréal. Cet événement national vise à outiller la prochaine génération d’ingénieur·e·s pour qu’elle innove et agisse avec responsabilité. Pendant trois jours, rencontrez des pairs engagé·e·s, assistez à des conférences inspirantes et prenez part à des ateliers pratiques, tous axés sur la construction d’un avenir plus durable.">
      </p>
